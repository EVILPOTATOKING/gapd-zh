<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏与谜题设计 · 目录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+SC:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/toc-data.js"></script>
  <script src="assets/bilingual.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">G&amp;PD</a>
    <div class="right" id="topbar-right"></div>
  </header>

  <main class="wrap">
    <section class="masthead" id="masthead"></section>
    <ul class="issue-nav" id="issue-nav"></ul>
    <div id="issues"></div>
  </main>

  <script>
    const { INFO, issues } = GAPD;
    const $ = (id) => document.getElementById(id);

    const right = $("topbar-right");
    right.appendChild(Bi.seg({
      zh: "选中文字后切换语言，可定位对应原文 · 快捷键 L",
      en: "Select text, then switch language to locate its counterpart · Press L",
    }, "span", "hint"));
    Bi.mountSwitch(right);

    // 刊头
    const mh = $("masthead");
    mh.append(
      Bi.seg({ zh: "期刊合订本 · 中文阅读版", en: "Journal Compendium" }, "p", "eyebrow"),
      Bi.seg(INFO.title, "h1"),
      Bi.seg(INFO.subtitle, "p", "sub"),
      Bi.seg(INFO.intro, "p", "intro"),
    );
    const meta = document.createElement("p");
    meta.className = "meta";
    meta.textContent = "ISSN 2376–5097 · Vol. 1–3 · 2015–2017";
    mh.appendChild(meta);

    const people = document.createElement("ul");
    people.className = "people";
    INFO.people.forEach((p) => {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = p.name;
      li.append(Bi.seg(p.role, "span", "role"), name, Bi.seg(p.org, "span", "org"));
      people.appendChild(li);
    });
    mh.appendChild(people);

    // 期号导航与目录
    const nav = $("issue-nav");
    const box = $("issues");
    issues.forEach((iss) => {
      const navLi = document.createElement("li");
      const navA = document.createElement("a");
      navA.href = `#${iss.id}`;
      navA.appendChild(Bi.seg(iss.label));
      navLi.appendChild(navA);
      nav.appendChild(navLi);

      const sec = document.createElement("section");
      sec.className = "issue";
      sec.id = iss.id;
      const head = document.createElement("div");
      head.className = "issue-head";
      const year = document.createElement("span");
      year.className = "year";
      year.textContent = iss.year;
      head.append(Bi.seg(iss.label, "h2"), year);
      sec.appendChild(head);

      const ol = document.createElement("ol");
      ol.className = "toc";
      iss.articles.forEach((a) => {
        const li = document.createElement("li");
        const link = document.createElement("a");
        link.href = `article.html?id=${a.id}`;
        link.draggable = false;
        // 拖选文字后松开鼠标不应触发跳转
        link.addEventListener("click", (e) => {
          if (!window.getSelection().isCollapsed) e.preventDefault();
        });
        const author = document.createElement("span");
        author.className = "a";
        author.textContent = a.authors;
        const page = document.createElement("span");
        page.className = "p";
        page.textContent = a.page;
        link.append(
          Bi.seg(a.section, "span", "k"),
          Bi.seg(a.title, "span", "t"),
          author,
          page,
        );
        li.appendChild(link);
        ol.appendChild(li);
      });
      sec.appendChild(ol);
      box.appendChild(sec);
    });

    const setTitle = () => {
      document.title = Bi.lang === "zh" ? "游戏与谜题设计 · 目录" : "Game & Puzzle Design · Contents";
    };
    document.addEventListener("bi:lang", setTitle);
    setTitle();
  </script>
</body>
</html>
